  /nlp-v3/synthetic-extract:
    post:
      operationId: extractDeclaredSyntheticLabText
      description: Doctor-only in synthetic_dev or acknowledged evaluation_sandbox. Explicit synthetic declaration; no patient source IDs, chart writes or clinical
        rules. Normal CSRF. Mock/fallback modes explicitly labeled and never local_llm success. Existing CI case pipeline is the source-granted clinical workflow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - text
              - synthetic
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 12000
                synthetic:
                  const: true
      responses:
        '200':
          description: Explicit provider mode
          extraction data: null
          safe diagnostics: null
          fallback_used: null
          persisted false and clinical_rules_applied false: null
        '403':
          description: Doctor role or CSRF required
        '404':
          description: Workspace unavailable
        '413':
          description: Evaluation input byte limit
        '422':
          description: Invalid declared synthetic input
  /research/demo-datasets:
    get:
      operationId: listIndependentSyntheticResearchExamples
      description: Researcher only in permitted synthetic/evaluation workspace. Independent fixture metadata; never patient tables or automatic clinical data grant.
      responses:
        '200':
          description: Independent synthetic dataset descriptions
        '403':
          description: Researcher role required
        '404':
          description: Workspace unavailable
  /research/demo-datasets/{dataset_id}/summary:
    parameters:
    - name: dataset_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: summarizeIndependentSyntheticResearchExample
      description: Researcher/workspace guard; fixed synthetic_research_v3. Aggregate denominator/missingness and minimum cell-size policy retained. No clinical effect
        claim.
      responses:
        '200':
          description: Synthetic bounded summary
          method and suppression metadata: null
        '403':
          description: Researcher role required
        '404':
          description: Unknown dataset or workspace unavailable
        '422':
          description: Invalid filters
  /research/demo-datasets/{dataset_id}/synthetic-observations:
    parameters:
    - name: dataset_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: readIndependentSyntheticResearchExampleRows
      description: Researcher only; independently fabricated observations, never actual application patient records. Subject/date/cohort/mood fields are explicit
        synthetic fixture content.
      responses:
        '200':
          description: Declared synthetic fixture rows
        '403':
          description: Researcher role required
        '404':
          description: Unknown dataset or workspace unavailable
  /research/demo-datasets/{dataset_id}/export:
    parameters:
    - name: dataset_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: exportIndependentSyntheticResearchExampleAggregate
      description: Researcher guard and fixed dataset; unfiltered aggregate-only CSV. Filtered export and individual-row export refused; no clinical dataset permission
        inferred.
      responses:
        '200':
          description: Allowed aggregate CSV
          content:
            text/csv:
              schema:
                type: string
        '403':
          description: Researcher role required
        '404':
          description: Unknown dataset or workspace unavailable
        '422':
          description: Filtered export unsupported
  /evaluation/questionnaires/public-definitions:
    get:
      operationId: publicEvaluationQuestionnaires
      summary: Four synthetic evaluation-draft definitions; no answers stored anonymously.
      security: []
      responses:
        '200':
          description: Public evaluation/reference data
        '404':
          description: Unavailable or unknown item
  /clinical-catalog/search:
    get:
      operationId: searchClinicalCatalog
      summary: Paged public catalog; source/rights publication gates retained.
      security: []
      responses:
        '200':
          description: Public evaluation/reference data
        '404':
          description: Unavailable or unknown item
  /clinical-catalog/{kind}/{identifier}:
    get:
      operationId: getClinicalCatalogItem
      summary: Public source-safe reference detail; not prescribing.
      security: []
      responses:
        '200':
          description: Public evaluation/reference data
        '404':
          description: Unavailable or unknown item
      parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
      - name: identifier
        in: path
        required: true
        schema:
          type: string
  /clinical-catalog/instruments/{identifier}/eligibility:
    get:
      operationId: getInstrumentEligibility
      summary: Read-only instrument release and rights eligibility.
      security: []
      responses:
        '200':
          description: Public evaluation/reference data
        '404':
          description: Unavailable or unknown item
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
  /patient-experience/questionnaires/self-assign:
    post:
      operationId: selfAssignEvaluationQuestionnaire
      summary: Patient starts or resumes an evaluation-draft form; recover exact guest transfer after lost submit response. CSRF required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - definition_id
              properties:
                definition_id:
                  type: string
                  enum:
                  - eval_phq_9_v1
                  - eval_phq_2_v1
                  - eval_gad_7_v1
                  - eval_gad_2_v1
                idempotency_key:
                  type: string
                  minLength: 1
                  maxLength: 80
                  description: Optional guest transfer nonce, scoped to authenticated patient and form.
      responses:
        '200':
          description: Existing assignment recovered
        '201':
          description: New assignment
        '401':
          description: Authentication required
        '403':
          description: Role or CSRF denied
        '422':
          description: Invalid evaluation form or key
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OIDC JWT (RS256/ES256; pinned JWKS, MFA required)
  parameters:
    PatientId:
      name: patient_id
      in: path
      required: true
      schema:
        type: string
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Session required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found or access indistinguishable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Validation:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Invalid transition or optimistic conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CiReviewInput:
      type: object
      additionalProperties: false
      required:
      - review_revision
      - source_version
      - correctness
      - relevance
      - correction
      - note
      - idempotency_key
      properties:
        review_revision:
          type: integer
          minimum: 0
        source_version:
          type: string
          pattern: ^[a-f0-9]{64}$
        correctness:
          type: string
          enum:
          - supported
          - unsupported
          - needs_correction
          - unreviewed
        relevance:
          type: string
          enum:
          - relevant
          - low_priority
          - not_relevant
          - undecided
        correction:
          type: string
          maxLength: 2000
          description: Required only for needs_correction; never alters original evidence
        note:
          type: string
          maxLength: 2000
        idempotency_key:
          type: string
          format: uuid
    CiDurableReview:
      type: object
      required:
      - suggestion_id
      - source_version
      - source_revision
      - grant_version
      - tag
      - evidence
      - model_version
      - mode
      - review
      - history
      properties:
        suggestion_id:
          type: string
          description: Actor-bound canonical immutable claim identity; independent of RAM IDs/order
        patient_ref:
          type: string
        encounter_ref:
          type: string
        source_version:
          type: string
        source_revision:
          type: integer
        grant_version:
          type: string
        model_version:
          type: string
        mode:
          type: string
          enum:
          - local_llm
          - deterministic_mock
          - deterministic_mock_fallback
        tag:
          type: object
        evidence:
          type: array
          items:
            type: object
            required:
            - start
            - end
            - quote
            properties:
              start:
                type: integer
                minimum: 0
              end:
                type: integer
                minimum: 1
              quote:
                type: string
                description: Reconstructed from currently authorized exact Unicode span
        review:
          oneOf:
          - $ref: '#/components/schemas/CiReviewState'
          - type: 'null'
        stale:
          type: boolean
        can_review:
          type: boolean
        can_transfer:
          type: boolean
        history:
          type: array
          items:
            $ref: '#/components/schemas/CiReviewState'
    CiReviewState:
      type: object
      required:
      - revision
      - correctness
      - relevance
      - correction
      - note
      - status
      - created_at
      properties:
        revision:
          type: integer
          minimum: 1
        correctness:
          type: string
          enum:
          - supported
          - unsupported
          - needs_correction
          - unreviewed
        relevance:
          type: string
          enum:
          - relevant
          - low_priority
          - not_relevant
          - undecided
        correction:
          type: string
          maxLength: 2000
        note:
          type: string
          maxLength: 2000
        status:
          type: string
          enum:
          - confirmed
          - rejected
          - corrected
          - pending
        created_at:
          type: string
    CiNativeTransferInput:
      type: object
      additionalProperties: false
      required:
      - suggestion_id
      - review_revision
      - source_version
      - target_field
      - text
      - idempotency_key
      description: Optional native PUT extension. Original mode/content unchanged; server appends text to chosen field in own encounter draft. No signing or publication.
        Recheck claim and saved review immediately before commit.
      properties:
        suggestion_id:
          type: string
          maxLength: 64
        review_revision:
          type: integer
          minimum: 1
        source_version:
          type: string
        target_field:
          type: string
          enum:
          - narrative
          - assessment
          - follow_up
        text:
          type: string
          minLength: 1
          maxLength: 2000
        idempotency_key:
          type: string
          format: uuid
    ManualReferralInput:
      type: object
      additionalProperties: false
      required:
      - source_version
      - grant_version
      - authority
      - confirmed
      - decision
      - target_specialty
      - category
      - urgency
      - clinical_reason
      - idempotency_key
      properties:
        source_version:
          type: string
        grant_version:
          type: string
        authority:
          const: manual_physician
        confirmed:
          const: true
        decision:
          enum:
          - create
          - decline
        target_specialty:
          enum:
          - psychiatrist
          - psychotherapist
          - general_practice
          - neurologist
        category:
          enum:
          - mandatory
          - desired
        urgency:
          enum:
          - emergency
          - urgent
          - planned
        clinical_reason:
          type: string
          minLength: 1
          maxLength: 4000
        proposal_id:
          type:
          - string
          - 'null'
        idempotency_key:
          type: string
          format: uuid
    ManualReferral:
      type: object
      required:
      - id
      - patient_ref
      - case_ref
      - actor_id
      - authority
      - status
      - revision
      - source_version
      - grant_version
      - target_specialty
      - category
      - urgency
      - clinical_reason
      - confirmation_hash
      - history
      properties:
        id:
          type: string
        patient_ref:
          type: string
        case_ref:
          type: string
        actor_id:
          type: string
        authority:
          const: manual_physician
        status:
          enum:
          - created
          - cancelled
          - declined
        revision:
          type: integer
          minimum: 1
        source_version:
          type: string
        grant_version:
          type: string
        target_specialty:
          type: string
        category:
          enum:
          - mandatory
          - desired
        urgency:
          enum:
          - emergency
          - urgent
          - planned
        clinical_reason:
          type: string
        confirmation_hash:
          type: string
        critical:
          const: false
        severity:
          const: not_assessed
        rule_approved:
          const: false
        history:
          type: array
          items:
            type: object
            required:
            - action
            - revision
            - actor_id
            - created_at
            - reason
    DoctorChatJob:
      type: object
      additionalProperties: false
      required:
      - id
      - thread_id
      - status
      - safe_error_code
      - queued_at
      - started_at
      - finished_at
      - timings
      properties:
        id:
          type: string
        thread_id:
          type: string
        status:
          enum:
          - queued
          - running
          - completed
          - failed
          - timeout
          - cancelled
        safe_error_code:
          type: string
        queued_at:
          type: string
        started_at:
          type: string
        finished_at:
          type: string
        timings:
          type: object
        urgent_notice:
          type:
          - object
          - 'null'
    DoctorChatThread:
      type: object
      required:
      - id
      - patient_ref
      - case_ref
      - status
      - revision
      - source_version
      - grant_version
      - retention_state
      - context_preview
      - messages
      - jobs
      properties:
        id:
          type: string
        patient_ref:
          type: string
        case_ref:
          type:
          - string
          - 'null'
        audience:
          enum:
          - doctor
          - patient
        source_type:
          enum:
          - intake
          - diary
        source_id:
          type: string
        status:
          enum:
          - open
          - closed
        revision:
          type: integer
          minimum: 1
        source_version:
          type: string
        grant_version:
          type: string
        retention_state:
          enum:
          - retained_private
          - purged
        context_preview:
          type: object
          required:
          - source_type
          - scope
          - case_ref
          - source_version
          - description
        messages:
          type: array
          items:
            type: object
            required:
            - id
            - ordinal
            - role
            - content
            - status
            - mode
            - model
            - catalog_citations
            - evidence
            properties:
              id:
                type: string
              ordinal:
                type: integer
              role:
                enum:
                - user
                - assistant
              content:
                type: string
              mode:
                type: string
              model:
                type:
                - string
                - 'null'
              catalog_citations:
                type: array
                items:
                  $ref: '#/components/schemas/VerifiedCatalogCitation'
              evidence:
                type: array
                items:
                  type: object
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/DoctorChatJob'
    VerifiedCatalogCitation:
      type: object
      required:
      - citation_id
      - kind
      - catalog_id
      - catalog_version
      - section_id
      - fragment_id
      - text_digest
      - title
      - href
      - source_status
      properties:
        citation_id:
          type: string
        kind:
          enum:
          - diagnosis
          - therapy
          - medicine
        catalog_id:
          type: string
        catalog_version:
          type: string
        section_id:
          const: overview
        fragment_id:
          type: string
        text_digest:
          type: string
        title:
          type: string
        href:
          type: string
          pattern: ^/#/clinical-library/
        source_status:
          const: reference_only_not_prescribing
    GovernedClinicalProposals:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - patient_ref
      - case_ref
      - source_version
      - source_revision
      - grant_version
      - rule_policy_version
      - catalog_version
      - clinical_rules_status
      - label
      - proposals
      - evidence
      - clinical_action_enabled
      - referral_order_created
      - alert_delivery
      - limitation
      properties:
        schema_version:
          const: cc-clinical-proposals-v1
        patient_ref:
          type: string
        case_ref:
          type: string
        source_version:
          type: string
        source_revision:
          type: integer
        grant_version:
          type: string
        rule_policy_version:
          type: string
        catalog_version:
          type: string
        clinical_rules_status:
          enum:
          - experimental_synthetic
          - experimental_needs_validation
        label:
          type: string
        technical_status:
          type: string
        clinical_review_status:
          type: string
        proposal_status:
          enum:
          - proposed
          - no_relevant_proposal
        clinical_action_enabled:
          const: false
        referral_order_created:
          const: false
        alert_delivery:
          const: not_implemented
        limitation:
          type: string
        evidence:
          type: array
          items:
            type: object
            required:
            - id
            - source_type
            - case_ref
            - source_version
            - recorded_at
            - scope
            - start
            - end
            - quote
            properties:
              id:
                type: string
              source_type:
                const: intake
              case_ref:
                type: string
              source_version:
                type: string
              recorded_at:
                type: string
              scope:
                const: symptoms
              start:
                type: integer
              end:
                type: integer
              quote:
                type: string
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/GovernedClinicalProposal'
    GovernedClinicalProposal:
      type: object
      required:
      - id
      - type
      - title
      - status
      - rule
      - rule_approved
      - label
      - evidence_refs
      - source_version
      - limitations
      - missing_information
      - assessments
      - pending_questions
      - clinical_approval_state
      - catalog_links
      - rationale
      properties:
        id:
          type: string
        type:
          enum:
          - referral
          - diagnostic_hypothesis
          - therapy_reference
          - medicine_reference
          - safety_illustration
        title:
          type: string
        status:
          const: proposed_readonly
        rule_approved:
          const: false
        label:
          type: string
        clinical_approval_state:
          const: unreviewed
        rationale:
          type: string
        limitations:
          type: string
        source_version:
          type: string
        evidence_refs:
          type: array
          items:
            type: string
        missing_information:
          type: array
          items:
            type: string
        pending_questions:
          type: array
          items:
            type: string
        assessments:
          type: object
          additionalProperties:
            const: not_assessed
        target_specialty:
          type:
          - string
          - 'null'
        category:
          enum:
          - mandatory
          - desired
          - null
        urgency:
          enum:
          - emergency
          - urgent
          - planned
        critical:
          type: boolean
        severity:
          enum:
          - not_assessed
          - noncritical
          - critical
        priority_class:
          enum:
          - critical_illustration
          - clinician_attention
        catalog_links:
          type: array
          items:
            type: object
            required:
            - kind
            - id
            - title
            - href
            - source_version
            - clinical_gate
            - verification
            properties:
              kind:
                enum:
                - diagnosis
                - therapy
                - medicine
              id:
                type: string
              title:
                type: string
              href:
                type: string
              source_version:
                type: string
              clinical_gate:
                const: view_only
              verification:
                const: reference_only_not_prescribing
        rule:
          type: object
          required:
          - rule_id
          - version
          - ruleset_version
          - effective_at
          - expires_at
          - status
          - source
          - permitted_scope
          - permitted_population
          - age_constraints
          - contraindication_constraints
          - inclusion
          - exclusion
          - missing_data_behavior
          - validation_dataset_version
          - approval_evidence
          - supersedes
          properties:
            rule_id:
              type: string
            version:
              type: string
            ruleset_version:
              type: string
            status:
              enum:
              - experimental_synthetic
              - experimental_needs_validation
            effective_at:
              type: string
            expires_at:
              type: string
            source:
              type: object
              required:
              - source_id
              - source_type
              - source_version
              - provenance_uri
              - verification_status
              - verification_date
              - qualified_clinical_reviewer
              - reviewer_timestamp
              - author
              properties:
                source_id:
                  type: string
                source_type:
                  enum:
                  - synthetic_teaching_fixture
                  - experimental_engineering_heuristic
                source_version:
                  type: string
                provenance_uri:
                  type: string
                verification_status:
                  const: unverified
                verification_date:
                  type: 'null'
                qualified_clinical_reviewer:
                  type: 'null'
                reviewer_timestamp:
                  type: 'null'
                author:
                  type: string
    ScopedCISnapshot:
      type: object
      required:
      - schema_version
      - snapshot_version
      - source_revision
      - source_version
      - analysis_status
      - patient_ref
      - encounter_ref
      - granted_scopes
      - tags
      - evidence
      - draft_suggestions
      - routing
      - permissions
      properties:
        review_enabled:
          type: boolean
        claims_persisted:
          type: boolean
          description: Immutable claims are durable; snapshot itself remains transient
        schema_version:
          const: ci-v1
        snapshot_version:
          type: integer
          minimum: 0
        source_revision:
          type: integer
          minimum: 1
          description: Non-monotonic 48-bit content-addressed token; full source_version is authoritative
        source_version:
          type: string
          pattern: ^[a-f0-9]{64}$
        source_policy_version:
          const: ci-intake-symptoms-v1
        analysis_status:
          enum:
          - pending
          - ready
          - needs_review
          - unavailable
        reason_code:
          type:
          - string
          - 'null'
        patient_ref:
          type: string
        encounter_ref:
          type: string
        generated_at:
          type:
          - string
          - 'null'
        mode:
          enum:
          - local_llm
          - deterministic_mock
          - deterministic_mock_fallback
          - null
        model_version:
          type:
          - string
          - 'null'
        primary_model_version:
          type:
          - string
          - 'null'
        error_code:
          type:
          - string
          - 'null'
        granted_scopes:
          type: array
          items:
            const: symptoms
        tags:
          type: array
          items:
            type: object
            required:
            - id
            - code
            - category
            - label
            - evidence_refs
            - review_status
            - frequency
            properties:
              id:
                type: string
              suggestion_id:
                type: string
                description: Durable actor/source/model-bound claim when review enabled
              code:
                type: string
              category:
                enum:
                - symptom
                - topic
              label:
                type: string
              assertion:
                enum:
                - asserted
                - negated
                - uncertain
              temporality:
                enum:
                - current
                - past
                - future
                - unknown
              review_status:
                const: proposed
              evidence_refs:
                type: array
                items:
                  type: string
              frequency:
                type: object
                properties:
                  numerator:
                    const: 1
                  denominator:
                    const: 1
                  unit:
                    const: authorized_notes
                  window_start:
                    type: string
                  window_end:
                    type: string
        evidence:
          type: array
          items:
            type: object
            required:
            - id
            - source_type
            - source_id
            - quote
            - start
            - end
            - scope
            properties:
              id:
                type: string
              source_type:
                const: intake
              source_id:
                type: string
              quote:
                type: string
                maxLength: 2000
              start:
                type: integer
                minimum: 0
                description: Python Unicode codepoint start; not UTF-8 bytes or JS UTF-16 units
              end:
                type: integer
                minimum: 1
                description: Exclusive Python Unicode codepoint end
              scope:
                const: symptoms
              recorded_at:
                type: string
        draft_suggestions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              text:
                type: string
              status:
                const: proposed
              evidence_refs:
                type: array
                items:
                  type: string
        routing:
          type: array
          maxItems: 0
        permissions:
          type: object
          properties:
            can_review:
              type: boolean
              description: Current review flag and persisted authorized claims; clinical actions remain disabled
            can_create_referral:
              const: false
            clinical_action_enabled:
              const: false
        clinical_action_enabled:
          const: false
        clinical_rules_applied:
          const: false
        persisted:
          const: false
