openapi: 3.1.0
info:
  title: Clinical Compass API
  version: 0.9.2.6-phase04-evaluation
  description: Synthetic development and explicitly acknowledged isolated Evaluation MVP contract. Role/source/consent gates and manual clinical authority remain;
    no production clinical assurance.
servers:
- url: /api/v1
security:
- sessionCookie: []
- bearerAuth: []
tags:
- name: Auth
- name: Doctor
- name: Patient
- name: Clinical workflow
- name: AI
- name: Research
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      x-implementation: starter
      tags:
      - Auth
      responses:
        '200':
          description: Service alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /auth/me:
    get:
      operationId: getSession
      x-implementation: starter
      tags:
      - Auth
      responses:
        '200':
          description: Current session and CSRF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthContext'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /dev/switch-user:
    post:
      operationId: devSwitchUser
      x-implementation: starter
      description: Demo-only, never enabled on public or real-patient environments.
      security: []
      tags:
      - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - user_id
              properties:
                user_id:
                  type: string
                  enum:
                  - doc_psy
                  - doc_ther
                  - pat_01
                  - researcher_01
                  - clinic_01
      responses:
        '200':
          description: Demo identity selected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthContext'
        '403':
          $ref: '#/components/responses/Forbidden'
  /doctors/me/patients:
    get:
      operationId: getDoctorPatients
      x-implementation: starter
      tags:
      - Doctor
      parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 100
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - attention_desc
          - name_asc
          - last_activity_desc
          default: attention_desc
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: ACL-filtered patients
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorPatientList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /doctors/me/patients/{patient_id}/overview:
    get:
      operationId: getDoctorPatientOverview
      x-implementation: starter
      tags:
      - Doctor
      parameters:
      - $ref: '#/components/parameters/PatientId'
      responses:
        '200':
          description: Filtered DTO
          no fields without READ grant: null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientOverview'
        '404':
          $ref: '#/components/responses/NotFound'
  /doctors/me/alerts:
    get:
      operationId: getDoctorAlerts
      x-implementation: starter
      tags:
      - Doctor
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - open
          - acknowledged
          - assessed
      responses:
        '200':
          description: Alert inbox
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Alert'
  /alerts/{alert_id}/acknowledge:
    post:
      operationId: acknowledgeAlert
      x-implementation: starter
      tags:
      - Clinical workflow
      parameters:
      - name: alert_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: {}
      responses:
        '200':
          description: Acknowledged by clinician
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /alerts/{alert_id}/assessment:
    post:
      operationId: assessAlert
      x-implementation: planned
      tags:
      - Clinical workflow
      parameters:
      - name: alert_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - decision
              - note
              properties:
                decision:
                  type: string
                  enum:
                  - contact_requested
                  - urgent_evaluation
                  - monitor
                  - escalate
                note:
                  type: string
                  maxLength: 5000
      responses:
        '200':
          description: Recorded physician assessment
  /patients/me:
    get:
      operationId: getPatientSelf
      x-implementation: planned
      tags:
      - Patient
      responses:
        '200':
          description: Self profile
  /patients/me/check-ins:
    post:
      operationId: createPatientCheckin
      x-implementation: starter
      tags:
      - Patient
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckinCreate'
      responses:
        '201':
          description: Stored observation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinResult'
        '422':
          $ref: '#/components/responses/Validation'
    get:
      operationId: listPatientCheckins
      tags:
      - Patient
      summary: Read own minimized self-report trend points
      x-implementation: integrated-synthetic
      x-security-boundary: server role/tenant/case authorization
      responses:
        '200':
          description: Scoped response
        '201':
          description: Created
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
  /patients/me/questionnaires/{request_id}/responses:
    post:
      operationId: submitQuestionnaire
      x-implementation: planned
      tags:
      - Patient
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - answers
              properties:
                answers:
                  type: object
                  additionalProperties:
                    type: integer
                questionnaire_version:
                  type: string
      responses:
        '201':
          description: Stored and clinically validated scoring
  /patients/me/medication-reports:
    post:
      operationId: createMedicationReport
      x-implementation: planned
      tags:
      - Patient
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicationReportCreate'
      responses:
        '201':
          description: Self-reported adherence
          approximation preserved: null
  /appointments/requests:
    post:
      operationId: requestAppointment
      x-implementation: planned
      tags:
      - Clinical workflow
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - clinician_id
              properties:
                clinician_id:
                  type: string
                reason:
                  type: string
                  maxLength: 2000
      responses:
        '201':
          description: Appointment requested
          not confirmed: null
  /questionnaire-requests:
    post:
      operationId: assignQuestionnaire
      x-implementation: planned
      tags:
      - Clinical workflow
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - patient_id
              - questionnaire_key
              properties:
                patient_id:
                  type: string
                questionnaire_key:
                  type: string
                due_at:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Assigned to patient inbox
  /messages:
    post:
      operationId: postMessage
      x-implementation: planned
      tags:
      - Clinical workflow
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - thread_id
              - text
              properties:
                thread_id:
                  type: string
                text:
                  type: string
                  maxLength: 3000
      responses:
        '201':
          description: Message in authorized thread
  /ai/chat:
    post:
      operationId: aiChat
      x-implementation: planned
      tags:
      - AI
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - message
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        '200':
          description: Scoped response with provider/mode label and safety fallback
  /ai/summaries:
    post:
      operationId: aiCreateSummary
      x-implementation: planned
      tags:
      - AI
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - patient_id
              - source_ids
              properties:
                patient_id:
                  type: string
                source_ids:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Draft only
          not a clinical decision: null
  /ai/summaries/{summary_id}/confirm:
    post:
      operationId: aiConfirmSummary
      x-implementation: planned
      tags:
      - AI
      parameters:
      - name: summary_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - edited_text
              - version
              properties:
                edited_text:
                  type: string
                version:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Confirmed human-authored record
  /research/datasets:
    get:
      operationId: listResearchDatasets
      x-implementation: planned
      tags:
      - Research
      responses:
        '200':
          description: Synthetic research datasets
  /research/datasets/{dataset_id}/cohort:
    get:
      operationId: getResearchCohort
      x-implementation: planned
      tags:
      - Research
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: string
      - name: medication_key
        in: query
        schema:
          type: string
      - name: dose_band
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Safe aggregate
          counts below privacy minimum suppressed: null
  /public/doctors:
    get:
      operationId: listPublicDoctors
      tags:
      - Doctor
      summary: Public directory, no clinical data
      x-implementation: integrated-synthetic
      x-security-boundary: server role/tenant/case authorization
      responses:
        '200':
          description: Scoped response
        '201':
          description: Created
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
  /public/doctors/{slug}:
    get:
      operationId: getPublicDoctor
      tags:
      - Doctor
      summary: Public doctor profile only
      x-implementation: integrated-synthetic
      x-security-boundary: server role/tenant/case authorization
      responses:
        '200':
          description: Scoped response
        '201':
          description: Created
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
  /invitations:
    post:
      operationId: issueInvitation
      tags:
      - Auth
      summary: Recipient bound hashed invitation
      x-implementation: integrated-synthetic
      x-security-boundary: server role/tenant/case authorization
      responses:
        '200':
          description: Scoped response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationIssued'
        '201':
          description: Created
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationIssue'
  /invitations/accept:
    post:
      operationId: redeemInvitation
      tags:
      - Auth
      summary: Single-use atomic token redemption
      x-implementation: integrated-synthetic
      x-security-boundary: server role/tenant/case authorization
      responses:
        '200':
          description: Scoped response
        '201':
          description: Created
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - registration_code
              properties:
                registration_code:
                  type: string
  /invitations/{invitation_id}/revoke:
    post:
      operationId: revokeInvitation
      tags:
      - Auth
      summary: Issuer revokes pending invitation
      x-implementation: integrated-synthetic
      x-security-boundary: server role/tenant/case authorization
      responses:
        '200':
          description: Scoped response
        '201':
          description: Created
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /previsit-cases:
    get:
      operationId: listPrevisitCases
      tags:
      - Clinical workflow
      summary: Participant case list only
      x-implementation: integrated-synthetic
      x-security-boundary: server role/tenant/case authorization
      responses:
        '200':
          description: Scoped response
        '201':
          description: Created
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
    post:
      operationId: createPrevisitCase
      tags:
      - Clinical workflow
      summary: Case-scoped consent, no automatic link
      x-implementation: integrated-synthetic
      x-security-boundary: server role/tenant/case authorization
      responses:
        '200':
          description: Scoped response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrevisitCaseDetail'
        '201':
          description: Created
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrevisitCreate'
  /previsit-cases/{case_id}:
    get:
      operationId: getPrevisitCase
      tags:
      - Clinical workflow
      summary: Participant-scoped immutable snapshot
      x-implementation: integrated-synthetic
      x-security-boundary: server role/tenant/case authorization
      responses:
        '200':
          description: Scoped response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrevisitCaseDetail'
        '201':
          description: Created
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
  /previsit-cases/{case_id}/messages:
    get:
      operationId: listCaseMessages
      tags:
      - Clinical workflow
      summary: Separate previsit thread
      x-implementation: integrated-synthetic
      x-security-boundary: server role/tenant/case authorization
      responses:
        '200':
          description: Scoped response
        '201':
          description: Created
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
    post:
      operationId: postCaseMessage
      tags:
      - Clinical workflow
      summary: Atomic one-patient-message-before-reply policy
      x-implementation: integrated-synthetic
      x-security-boundary: server role/tenant/case authorization
      responses:
        '200':
          description: Scoped response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadMessage'
        '201':
          description: Created
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
      requestBody:
        required: true
        content:
          application/json:
            schema: &id001
              type: object
              properties:
                text:
                  type: string
  /previsit-cases/{case_id}/appointment-requests:
    post:
      operationId: requestCaseAppointment
      tags:
      - Clinical workflow
      summary: Patient requests a time without link
      x-implementation: integrated-synthetic
      x-security-boundary: server role/tenant/case authorization
      responses:
        '200':
          description: Scoped response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '201':
          description: Created
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /previsit-cases/{case_id}/offers:
    post:
      operationId: offerCaseAppointment
      tags:
      - Clinical workflow
      summary: Clinician offers time without link
      x-implementation: integrated-synthetic
      x-security-boundary: server role/tenant/case authorization
      responses:
        '200':
          description: Scoped response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '201':
          description: Created
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - proposed_at
              - format
              properties:
                proposed_at:
                  type: string
                format:
                  type: string
                  enum:
                  - video
                  - audio
                  - in_person
  /appointments:
    get:
      operationId: listAppointments
      tags:
      - Clinical workflow
      summary: Actor-scoped appointment list
      x-implementation: integrated-synthetic
      x-security-boundary: server role/tenant/case authorization
      responses:
        '200':
          description: Scoped response
        '201':
          description: Created
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
  /appointments/{appointment_id}/confirm:
    post:
      operationId: confirmAppointment
      tags:
      - Clinical workflow
      summary: Patient confirms clinician offer
      x-implementation: integrated-synthetic
      x-security-boundary: server role/tenant/case authorization
      responses:
        '200':
          description: Scoped response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '201':
          description: Created
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /patient/care-team-visibility:
    get:
      operationId: listCareTeamVisibility
      tags:
      - Clinical workflow
      summary: Patient owns pair-scoped grants
      x-implementation: integrated-synthetic
      x-security-boundary: server role/tenant/case authorization
      responses:
        '200':
          description: Scoped response
        '201':
          description: Created
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
  /care-team/visibility:
    post:
      operationId: setCareTeamVisibility
      tags:
      - Clinical workflow
      summary: Grant or revoke pair presence only
      x-implementation: integrated-synthetic
      x-security-boundary: server role/tenant/case authorization
      responses:
        '200':
          description: Scoped response
        '201':
          description: Created
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - doctor_a
              - doctor_b
              - allow
              properties:
                doctor_a:
                  type: string
                doctor_b:
                  type: string
                allow:
                  type: boolean
  /doctors/{doctor_id}/shared-patients:
    get:
      operationId: listSharedPairPseudonyms
      tags:
      - Doctor
      summary: Minimal pair-specific pseudonyms, no counts of hidden patients
      x-implementation: integrated-synthetic
      x-security-boundary: server role/tenant/case authorization
      responses:
        '200':
          description: Scoped response
        '201':
          description: Created
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
  /threads/{kind}/{other_id}/messages:
    get:
      operationId: listSeparatedMessages
      tags:
      - Clinical workflow
      summary: Separated doctor_peer vs patient_doctor
      x-implementation: integrated-synthetic
      x-security-boundary: server role/tenant/case authorization
      responses:
        '200':
          description: Scoped response
        '201':
          description: Created
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
    post:
      operationId: postSeparatedMessage
      tags:
      - Clinical workflow
      summary: Participants only, no implicit clinical share
      x-implementation: integrated-synthetic
      x-security-boundary: server role/tenant/case authorization
      responses:
        '200':
          description: Scoped response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadMessage'
        '201':
          description: Created
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
  /patients/me/clinical:
    get:
      operationId: patientClinicalRecords
      tags:
      - Patient
      summary: Patient-only clinician-confirmed records
      x-implementation: integrated-synthetic
      x-security-boundary: server role/tenant/case authorization
      responses:
        '200':
          description: Scoped response
        '201':
          description: Created
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
  /doctors/me/patients/{patient_id}/clinical:
    get:
      operationId: clinicianScopedClinical
      tags:
      - Doctor
      summary: Grant filtered diagnoses and medications
      x-implementation: integrated-synthetic
      x-security-boundary: server role/tenant/case authorization
      responses:
        '200':
          description: Scoped response
        '201':
          description: Created
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
  /doctors/me/patients/{patient_id}/diagnoses:
    post:
      operationId: confirmClinicalDiagnosis
      tags:
      - Doctor
      summary: Clinician-confirmed condition only
      x-implementation: integrated-synthetic
      x-security-boundary: server role/tenant/case authorization
      responses:
        '200':
          description: Scoped response
        '201':
          description: Created
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - label
              properties:
                label:
                  type: string
  /doctors/me/patients/{patient_id}/medications:
    post:
      operationId: addClinicianMedication
      tags:
      - Doctor
      summary: Clinical link medication scope required
      x-implementation: integrated-synthetic
      x-security-boundary: server role/tenant/case authorization
      responses:
        '200':
          description: Scoped response
        '201':
