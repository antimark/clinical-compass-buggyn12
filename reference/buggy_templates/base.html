<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Клинический Компас{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <!-- Тема ставится до отрисовки, чтобы не было вспышки другой палитры. -->
  <script src="{{ url_for('static', filename='js/theme-init.js') }}"></script>
  <!-- Общая дизайн-система: tokens / themes / reset / shared buttons / header. -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  {% block styles %}{% endblock %}
</head>
<body>
  <!-- Локальная библиотека SVG-символов. Размер, цвет и обводка: CSS. -->
  <svg xmlns="http://www.w3.org/2000/svg" class="sr-only" aria-hidden="true">
    <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m14.7 9.3-2.1 5.4-3.3-3.3 5.4-2.1Z"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M4 12h16m-7-7 7 7-7 7"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M20 12H4m7 7-7-7 7-7"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.8a5.5 5.5 0 0 0-7.8 0L12 5.9l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.4a5.5 5.5 0 0 0 0-7.8Z"/></symbol>
    <symbol id="i-medical" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 5V3m8 2V3M3 11h18m-9 3v5m-2.5-2.5h5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4 10-10"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="m3 3 18 18M10.6 6.1c.5-.1.9-.1 1.4-.1 6.4 0 10 6 10 6a17 17 0 0 1-3.1 3.5M6.8 6.8A18.3 18.3 0 0 0 2 12s3.6 6 10 6a10.4 10.4 0 0 0 4-.8M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5.1 3.5 8.6 8 11 4.5-2.4 8-5.9 8-11V5l-8-3Z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 3v18m-7-7 7 7 7-7"/></symbol>
    <symbol id="i-arrow-up-right" viewBox="0 0 24 24"><path d="M6 18 18 6M8 6h10v10"/></symbol>
    <symbol id="i-list-check" viewBox="0 0 24 24"><path d="m3 6 2 2 4-4M12 6h9M3 16l2 2 4-4m3 2h9"/></symbol>
    <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M2 12h5l3-8 4 16 3-8h5"/></symbol>
    <symbol id="i-message-circle" viewBox="0 0 24 24"><path d="M20 11.5a8.5 8.5 0 0 1-8.5 8.5 9.2 9.2 0 0 1-4-.9L3 21l1.8-4.6a8.5 8.5 0 1 1 15.2-4.9Z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="3"/><circle cx="8" cy="9" r="2"/><path d="m4 18 6-6 4 4 3-3 5 5"/></symbol>
  </svg>
  <!-- Единый header для всех маршрутов. -->
  <header class="site-header">
    <div class="site-header-inner">
      <a class="site-brand" href="{{ url_for('index') }}" aria-label="Клинический Компас — на главную">
        <span class="site-brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-compass"></use></svg></span>
        <span>клинический<span class="site-brand-accent">.</span>компас</span>
      </a>
      <div class="site-header-right">
        {% block header_right %}{% endblock %}
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Переключить тему" title="Переключить тему">
          <svg class="icon light-icon" aria-hidden="true"><use href="#i-moon"></use></svg>
          <svg class="icon dark-icon" aria-hidden="true"><use href="#i-sun"></use></svg>
        </button>
      </div>
    </div>
  </header>
  <!-- Содержимое отдельной страницы через Jinja block content. -->
  {% block content %}{% endblock %}
  <!-- Работа переключателя светлой/тёмной темы. -->
  <script defer src="{{ url_for('static', filename='js/theme.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
